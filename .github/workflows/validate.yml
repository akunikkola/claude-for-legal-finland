name: Validate

# Runs the structure and quality gates on every push and pull request.
# The gate blocks errors that break the marketplace — frontmatter, consistency
# between the manifests, dead links, portability, and the Cowork validator's
# digit-comma trap — before they reach a user's installation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate structure and frontmatter
        run: node scripts/validate.mjs

      - name: Check repository invariants
        run: node scripts/check-invariants.mjs

      - name: Check portability (skill references stay inside the domain)
        run: node scripts/check-portability.mjs

      - name: Check output-language declarations
        run: node scripts/check-output-language.mjs

      - name: Check safety mechanisms are intact
        run: node scripts/check-safety-mechanisms.mjs

      - name: Check citation integrity
        run: node scripts/check-citations.mjs

      - name: Check descriptions
        run: node scripts/check-descriptions.mjs

      # Offline only. The trigger evals themselves make real model calls and
      # must never run in CI — see evals/README.md.
      - name: Check eval scenarios resolve
        run: node evals/check-scenarios.mjs

      - name: Check that generated files are up to date
        run: bash scripts/check-generated.sh

      - name: Run Node tests
        run: node --test tests/*.test.mjs

  portability-tests:
    name: Node tests (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run Node tests
        run: node --test tests/*.test.mjs
