name: Release domain ZIPs

# Builds a ZIP per domain on a tag (vX.Y.Z) or manually, and attaches them to a
# GitHub Release. That gives stable download URLs:
#   https://github.com/<owner>/<repo>/releases/latest/download/<domain>.zip
# Useful for non-technical users (install from .zip).
#
# NOTE: each ZIP contains the whole domain (skills/, AGENTS.md, references/,
# mcp.json, .mcp.json, plugin.json, .claude-plugin/, .codex-plugin/) so that an
# installation is complete. The whole <domain>/ is the unit of portability — see
# AGENTS.md, section "Portability" — and scripts/check-portability.mjs guards it.
# Verify the install works in the target environment before a wide release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Empty = ZIPs only, no Release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate before packaging
        run: |
          bash scripts/check-generated.sh
          node scripts/validate.mjs
          node scripts/check-invariants.mjs
          node scripts/check-portability.mjs
          node scripts/check-output-language.mjs
          node scripts/check-safety-mechanisms.mjs
          node scripts/check-citations.mjs
          node scripts/check-descriptions.mjs
          node --test tests/*.test.mjs

      - name: Read domains from marketplace.json
        id: plugins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          m = json.loads(pathlib.Path('marketplace.json').read_text())
          print('names=' + ' '.join(p['name'] for p in m['plugins']))
          PY

      - name: Build ZIPs
        run: |
          mkdir -p dist
          for plugin in ${{ steps.plugins.outputs.names }}; do
            echo "Packing $plugin.zip"
            (cd "$plugin" && zip -rq "../dist/${plugin}.zip" . -x '*.DS_Store' '__pycache__/*' '*.pyc')
          done
          cp marketplace.json dist/marketplace.json
          # The whole collection as a single package
          (cd dist && zip -rq "all-domains.zip" ./*.zip marketplace.json)
          ls -lh dist

      - name: Resolve tag
        id: tagref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        if: steps.tagref.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tagref.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating assets."
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          for asset in dist/*.zip dist/marketplace.json; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v5
        with:
          name: domain-zips
          path: dist/*
          retention-days: 30
